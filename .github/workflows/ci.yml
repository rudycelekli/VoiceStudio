# PROPOSAL ONLY. Root must approve registration and execution.
# Run in the owned fork only. This file is not part of the candidate source tree.
name: Owned CUDA Docker qualification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source commit (only the approved commit is accepted)
        type: string
        required: true
        default: d54ae7f2a478bab4d103374806a7b32542b86047

permissions:
  contents: read

concurrency:
  group: owned-cuda-qualification
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-only:
    if: github.repository == 'rudycelekli/VoiceStudio' && github.event_name == 'workflow_dispatch' && github.actor == 'rudycelekli'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_SHA: d54ae7f2a478bab4d103374806a7b32542b86047
      EXPECTED_TREE: 378499a9c2e93d2beb64c20102b73abf6e6d849b
    steps:
      - name: Validate immutable input before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$EXPECTED_SHA"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: rudycelekli/VoiceStudio
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify exact reviewed source and Docker inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          git show -s --format='source=%H tree=%T' HEAD
          sha256sum deploy/Dockerfile deploy/torch-constraints.txt pyproject.toml uv.lock package.json bun.lock electron/package.json .dockerignore backend/services/dub_qc.py
          docker version
          docker buildx version
          docker buildx inspect default

      # GitHub-hosted ephemeral runner only, before any image is built.
      # Same unused SDK locations as the current upstream Docker workflow.
      # The checkout, daemon data, runner binaries, and host tools are preserved.
      - name: Reclaim unused ephemeral runner SDK space
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/boost /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /
          available=$(df -PB1 / | awk 'NR==2 {print $4}')
          test "$available" -ge 45000000000

      - name: Build unchanged default CUDA image locally (no registry writes)
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/owned-empty-docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          # No build args: Dockerfile default BASE_IMAGE, GPU_FLAVOR and target.
          # Public apt/npm/PyPI/GitHub dependency downloads are required.
          # No login, push, cache export, artifact upload, release, or app launch.
          timeout --signal=TERM --kill-after=60s 38m docker buildx build \
            --builder default --platform linux/amd64 --load \
            --file deploy/Dockerfile --tag voicestudio-local-qualification:cuda \
            --iidfile "$RUNNER_TEMP/owned-image-id" \
            --metadata-file "$RUNNER_TEMP/owned-build-metadata.json" \
            --progress plain .
          cat "$RUNNER_TEMP/owned-image-id"
          cat "$RUNNER_TEMP/owned-build-metadata.json"
          docker image inspect voicestudio-local-qualification:cuda \
            --format 'id={{.Id}} os={{.Os}} arch={{.Architecture}} created={{.Created}}'
          df -h /

      - name: Verify actual image scorer offline without app startup or inference
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/owned-empty-docker-config"
          timeout --signal=TERM --kill-after=10s 90s docker run --rm -i \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 1g --cpus 1 --pids-limit 64 --no-healthcheck \
            --tmpfs /app/omnivoice_data:rw,noexec,nosuid,size=8m \
            --tmpfs /tmp:rw,noexec,nosuid,size=8m \
            -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
            --entrypoint python3 voicestudio-local-qualification:cuda - <<'PYTHON'
          import hashlib
          import unicodedata
          from pathlib import Path
          from services.dub_qc import word_error_rate
          expected = "09471906e3c8f115c05e8a27343bfb844c17b954511691deb50c7aa55978d1e7"
          assert hashlib.sha256(Path("/app/backend/services/dub_qc.py").read_bytes()).hexdigest() == expected
          for text in ("café", "がくせい", "한글"):
              decomposed = unicodedata.normalize("NFD", text)
              assert word_error_rate(text, decomposed) == 0.0
              assert word_error_rate(decomposed, text) == 0.0
          assert word_error_rate("café", "cafe") > 0.0
          assert word_error_rate("が", "か") > 0.0
          assert word_error_rate("ﬃ", "ffi") > 0.0
          print("Actual default CUDA image: source hash and six canonical directions / three genuine-difference controls PASS; no ASR/TTS inference")
          PYTHON
