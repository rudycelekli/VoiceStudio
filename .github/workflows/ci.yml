name: Private Voice3554 frozen native gates
'on':
  workflow_dispatch: {}
permissions:
  contents: read
env:
  HF_HUB_OFFLINE: '1'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  UV_HTTP_TIMEOUT: '120'
  UV_HTTP_RETRIES: '5'
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os:
        - ubuntu-24.04
        - macos-14
        - windows-2022
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: debpalash/VoiceStudio
        ref: 8ed9dad7223830f90f59aac6a4a7b9af40b6653d
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Materialize frozen source
      shell: bash
      run: "python - <<'PY'\nimport base64, json, os, pathlib, subprocess, zlib\np = json.loads(zlib.decompress(base64.b64decode(\"\")))\nassert subprocess.check_output([\"git\", \"rev-parse\", \"HEAD\"], text=True).strip() == p[\"base\"]\nsubprocess.run([\"git\", \"apply\", \"--binary\", \"-\"], input=base64.b64decode(p[\"patch\"]), check=True)\nsubprocess.run([\"git\", \"add\", \"-u\"], check=True)\nsubprocess.run([\"git\", \"add\", \"changelog.d/3554.fixed.md\", \"tests/test_speech_client_boundaries.py\"], check=True)\nassert subprocess.check_output([\"git\", \"write-tree\"], text=True).strip() == p[\"tree\"]\nartifacts = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"voice3554-proof\"\nartifacts.mkdir()\n(artifacts / \"source-contract.json\").write_text(json.dumps({\"base\": p[\"base\"], \"tree\": p[\"tree\"]}, indent=2))\n(artifacts / \"baseline-client.py\").write_bytes(base64.b64decode(p[\"baseline_client\"]))\n\ncache = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"voice3554-empty-hf\"\nassert not cache.exists(), \"HF cache must start empty\"\ncache.mkdir()\nwith open(os.environ[\"GITHUB_ENV\"], \"a\") as exports:\n    exports.write(\"HF_HUB_CACHE=\" + str(cache) + \"\\n\")\nPY"
    - name: Install locked native pytest only
      shell: bash
      run: python -m pip install --disable-pip-version-check pytest==9.1.1
    - name: Real API and proxy baseline/candidate
      shell: bash
      run: "python - <<'PY'\nimport json, os, pathlib, shutil, subprocess, sys, xml.etree.ElementTree as ET\nq = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"voice3554-proof\"\ntests = q / \"native-tests\"\ntests.mkdir()\nfor name in [\"test_speech_client.py\", \"test_speech_client_boundaries.py\"]:\n    shutil.copy2(pathlib.Path(\"tests\") / name, tests / name)\nenv = dict(os.environ, PYTHONPATH=str(pathlib.Path(\"backend\").resolve()), HF_HUB_OFFLINE=\"1\")\nclient = pathlib.Path(\"backend/speech_client/__main__.py\")\nfixed = client.read_bytes()\ndef run(label):\n    with (q / (label + \".log\")).open(\"w\") as log:\n        result = subprocess.run([sys.executable, \"-m\", \"pytest\", \"--confcutdir=\" + str(tests), str(tests), \"-q\", \"--junitxml=\" + str(q / (label + \".xml\"))], env=env, stdout=log, stderr=subprocess.STDOUT, timeout=180)\n    root = ET.parse(q / (label + \".xml\")).getroot()\n    cases = list(root.iter(\"testcase\"))\n    failures = [x.attrib.get(\"name\") for x in cases if x.find(\"failure\") is not None or x.find(\"error\") is not None]\n    skips = [x.attrib.get(\"name\") for x in cases if x.find(\"skipped\") is not None]\n    return {\"exit\": result.returncode, \"cases\": len(cases), \"failures\": failures, \"skips\": skips}\ntry:\n    client.write_bytes((q / \"baseline-client.py\").read_bytes())\n    baseline = run(\"baseline\")\nfinally:\n    client.write_bytes(fixed)\ncandidate = run(\"candidate\")\nexpected = {\"test_credentialed_loopback_bypasses_proxy_without_changing_environment[True-\" + host + \"]\" for host in [\"2130706433\", \"0x7f000001\", \"127.1\"]}\nclassification = {\"baseline\": baseline, \"candidate\": candidate, \"baseline_platform_classification\": \"EXPECTED_PROXY_FAILURES_ONLY\" if set(baseline[\"failures\"]).issubset(expected) else \"UNEXPECTED_PLATFORM_FAILURES\", \"expected_failure_count_is_not_forced\": True}\n(q / \"native-results.json\").write_text(json.dumps(classification, indent=2))\nprint(json.dumps(classification, indent=2))\nassert baseline[\"cases\"] == 32 and not baseline[\"skips\"]\nassert set(baseline[\"failures\"]).issubset(expected), \"Classify unexpected baseline platform failures; do not edit test expectations.\"\nassert candidate == {\"exit\": 0, \"cases\": 32, \"failures\": [], \"skips\": []}\n\nPY"
    - name: Exact source guards
      if: always()
      shell: bash
      run: 'python - <<''PY''

        import subprocess

        subprocess.run(["git", "diff", "--exit-code"], check=True)

        assert subprocess.check_output(["git", "write-tree"], text=True).strip() == "a917141f6891a9a77b0b96544247c4743f69173d"

        PY'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: voice3554-native-${{ matrix.os }}
        path: ${{ runner.temp }}/voice3554-proof
        if-no-files-found: error
        retention-days: 7
  full-python:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: debpalash/VoiceStudio
        ref: 8ed9dad7223830f90f59aac6a4a7b9af40b6653d
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.2
    - name: Materialize frozen source
      shell: bash
      run: "python - <<'PY'\nimport base64, json, os, pathlib, subprocess, zlib\np = json.loads(zlib.decompress(base64.b64decode(\"\")))\nassert subprocess.check_output([\"git\", \"rev-parse\", \"HEAD\"], text=True).strip() == p[\"base\"]\nsubprocess.run([\"git\", \"apply\", \"--binary\", \"-\"], input=base64.b64decode(p[\"patch\"]), check=True)\nsubprocess.run([\"git\", \"add\", \"-u\"], check=True)\nsubprocess.run([\"git\", \"add\", \"changelog.d/3554.fixed.md\", \"tests/test_speech_client_boundaries.py\"], check=True)\nassert subprocess.check_output([\"git\", \"write-tree\"], text=True).strip() == p[\"tree\"]\nartifacts = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"voice3554-proof\"\nartifacts.mkdir()\n(artifacts / \"source-contract.json\").write_text(json.dumps({\"base\": p[\"base\"], \"tree\": p[\"tree\"]}, indent=2))\n(artifacts / \"baseline-client.py\").write_bytes(base64.b64decode(p[\"baseline_client\"]))\n\ncache = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"voice3554-empty-hf\"\nassert not cache.exists(), \"HF cache must start empty\"\ncache.mkdir()\nwith open(os.environ[\"GITHUB_ENV\"], \"a\") as exports:\n    exports.write(\"HF_HUB_CACHE=\" + str(cache) + \"\\n\")\nPY"
    - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39
      with:
        enable-cache: false
    - name: Native media prerequisites
      run: sudo apt-get update && sudo apt-get install -y ffmpeg squashfs-tools
    - name: Install frozen Python dependencies
      run: bash scripts/uv-sync-retry.sh --frozen --all-extras
    - name: Full repository pytest
      run: uv run --no-sync pytest tests/ -q --tb=short -n auto --junitxml="${RUNNER_TEMP}/voice3554-proof/full-tests.xml" > "${RUNNER_TEMP}/voice3554-proof/full-tests.log" 2>&1
    - name: Full backend isolated pytest
      if: ${{ !cancelled() }}
      run: uv run --no-sync pytest backend/tests/ -q --tb=short --junitxml="${RUNNER_TEMP}/voice3554-proof/backend-tests.xml" > "${RUNNER_TEMP}/voice3554-proof/backend-tests.log" 2>&1
    - name: Exact source guards
      if: always()
      shell: bash
      run: 'python - <<''PY''

        import subprocess

        subprocess.run(["git", "diff", "--exit-code"], check=True)

        assert subprocess.check_output(["git", "write-tree"], text=True).strip() == "a917141f6891a9a77b0b96544247c4743f69173d"

        PY'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: voice3554-full-python
        path: ${{ runner.temp }}/voice3554-proof
        if-no-files-found: error
        retention-days: 7
  electron:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: debpalash/VoiceStudio
        ref: 8ed9dad7223830f90f59aac6a4a7b9af40b6653d
        persist-credentials: false
        fetch-depth: 1
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.2
    - name: Materialize frozen source
      shell: bash
      run: "python - <<'PY'\nimport base64, json, os, pathlib, subprocess, zlib\np = json.loads(zlib.decompress(base64.b64decode(\"\")))\nassert subprocess.check_output([\"git\", \"rev-parse\", \"HEAD\"], text=True).strip() == p[\"base\"]\nsubprocess.run([\"git\", \"apply\", \"--binary\", \"-\"], input=base64.b64decode(p[\"patch\"]), check=True)\nsubprocess.run([\"git\", \"add\", \"-u\"], check=True)\nsubprocess.run([\"git\", \"add\", \"changelog.d/3554.fixed.md\", \"tests/test_speech_client_boundaries.py\"], check=True)\nassert subprocess.check_output([\"git\", \"write-tree\"], text=True).strip() == p[\"tree\"]\nartifacts = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"voice3554-proof\"\nartifacts.mkdir()\n(artifacts / \"source-contract.json\").write_text(json.dumps({\"base\": p[\"base\"], \"tree\": p[\"tree\"]}, indent=2))\n(artifacts / \"baseline-client.py\").write_bytes(base64.b64decode(p[\"baseline_client\"]))\n\ncache = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"voice3554-empty-hf\"\nassert not cache.exists(), \"HF cache must start empty\"\ncache.mkdir()\nwith open(os.environ[\"GITHUB_ENV\"], \"a\") as exports:\n    exports.write(\"HF_HUB_CACHE=\" + str(cache) + \"\\n\")\nPY"
    - name: Native media prerequisites
      run: sudo apt-get update && sudo apt-get install -y ffmpeg squashfs-tools
    - name: Install frozen Electron dependencies
      run: bun install --frozen-lockfile
    - name: Frontend unit tests
      run: bun run test:frontend > "${RUNNER_TEMP}/voice3554-proof/frontend.log" 2>&1
    - name: Electron required check
      if: ${{ !cancelled() }}
      run: bun run check:electron > "${RUNNER_TEMP}/voice3554-proof/check-electron.log" 2>&1
    - name: Snap artifact regression
      if: ${{ !cancelled() }}
      run: node --test electron/tests/snap-artifact-verification.test.mjs electron/tests/snap-launcher.test.mjs electron/tests/snap-store-packaging.test.mjs electron/tests/omnivoice-tts-bundle.test.mjs > "${RUNNER_TEMP}/voice3554-proof/snap.log" 2>&1
    - name: Exact source guards
      if: always()
      shell: bash
      run: 'python - <<''PY''

        import subprocess

        subprocess.run(["git", "diff", "--exit-code"], check=True)

        assert subprocess.check_output(["git", "write-tree"], text=True).strip() == "a917141f6891a9a77b0b96544247c4743f69173d"

        PY'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: voice3554-electron
        path: ${{ runner.temp }}/voice3554-proof
        if-no-files-found: error
        retention-days: 7
